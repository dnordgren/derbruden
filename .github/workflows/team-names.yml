name: Team Names

on:
  schedule:
    # Tuesdays at 8am ET. Cron runs on UTC only, so two windows cover
    # daylight time (Mar-Oct) and standard time (Nov-Feb). GitHub cron
    # rejects ranges that wrap the year, so list winter months out.
    - cron: '0 12 * 3-10 2'
    - cron: '0 13 * 11,12,1,2 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: team-names
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm install --prefix scripts

      - name: Configure league auth
        run: |
          {
            echo "ESPN_S2=${{ secrets.ESPN_S2 }}"
            echo "SWID=${{ secrets.SWID }}"
          } > scripts/.env

      - name: Sync team names from ESPN
        run: node scripts/sync-team-names.js

      - name: Check for changed pages
        id: status
        run: echo "count=$(git status --porcelain -- src | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: steps.status.outputs.count != '0'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy changed pages
        if: steps.status.outputs.count != '0'
        run: make deploy

      - name: Commit synced pages
        if: steps.status.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/
          git commit -m "chore: Weekly team name sync"
          git push
