name: Team Names

on:
  schedule:
    # Tuesdays at 8am ET. Cron runs on UTC only, so two windows cover
    # daylight time (Mar-Oct) and standard time (Nov-Feb). GitHub cron
    # rejects ranges that wrap the year, so list winter months out.
    - cron: '0 12 * 3-10 2'
    - cron: '0 13 * 11,12,1,2 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: team-names
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure league auth
        run: |
          {
            echo "ESPN_S2=${{ secrets.ESPN_S2 }}"
            echo "SWID=${{ secrets.SWID }}"
          } > scripts/.env

      - name: Sync team names and logos from ESPN
        run: node scripts/sync-team-names.js

      - name: Check for changed files
        id: status
        run: |
          echo "deploy_count=$(git status --porcelain -- src static/img | wc -l)" >> "$GITHUB_OUTPUT"
          echo "commit_count=$(git status --porcelain -- src static/img scripts/owner-logos-state.json | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: steps.status.outputs.deploy_count != '0'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy changed pages and logos
        if: steps.status.outputs.deploy_count != '0'
        run: make deploy

      - name: Commit synced pages and logos
        if: steps.status.outputs.commit_count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/ static/img/
          if [ -f scripts/owner-logos-state.json ]; then
            git add scripts/owner-logos-state.json
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: Weekly team name and logo sync"
            git push
          fi
