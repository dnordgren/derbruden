name: Terraform

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action to run on the selected branch
        type: choice
        default: plan
        required: true
        options:
          - plan
          - apply

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '<2.0.0'
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Initialize (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate

  plan:
    name: Plan
    needs: validate
    # Skip fork PRs (no AWS creds) and skip cleanly before OIDC role variable is configured.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AWS_TERRAFORM_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    concurrency:
      group: terraform-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: gh-tf-plan-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '<2.0.0'
          terraform_wrapper: false

      - name: Terraform Init
        id: init
        run: |
          set +e
          terraform init -no-color -input=false 2>&1 | tee "$RUNNER_TEMP/tf-output.txt"
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Terraform Plan
        id: plan
        if: steps.init.outputs.rc == '0'
        run: |
          set +e
          terraform plan -no-color -input=false -detailed-exitcode -lock-timeout=5m 2>&1 | tee "$RUNNER_TEMP/tf-output.txt"
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 2 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment plan on PR
        if: always() && steps.init.outcome != 'skipped'
        uses: actions/github-script@v9
        env:
          INIT_RC: ${{ steps.init.outputs.rc }}
          PLAN_RC: ${{ steps.plan.outputs.rc }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const marker = '<!-- derbruden-terraform-plan -->';
            const outPath = path.join(process.env.RUNNER_TEMP, 'tf-output.txt');
            let raw = fs.existsSync(outPath)
              ? fs.readFileSync(outPath, 'utf8').trim()
              : '(no Terraform output captured)';

            const maxLen = 55000;
            if (raw.length > maxLen) {
              raw = `${raw.slice(0, maxLen)}\n\n... (output truncated; see full workflow logs)`;
            }

            const initRc = process.env.INIT_RC;
            const planRc = process.env.PLAN_RC;
            const shortSha = (process.env.HEAD_SHA || '').slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let heading;
            let footer = '';
            if (initRc !== '0') {
              heading = '❌ Terraform Init Failed';
            } else if (planRc === '0') {
              heading = '✅ Terraform Plan: No changes';
            } else if (planRc === '2') {
              heading = '📋 Terraform Plan: Changes detected';
              footer =
                '\n\nTo apply from this PR branch, comment `/tf apply` or approve the **Apply** deployment in the Checks tab.';
            } else {
              heading = '❌ Terraform Plan Failed';
            }

            const body = [
              marker,
              `### ${heading}`,
              `Commit \`${shortSha}\` · [Workflow logs](${runUrl})`,
              '',
              '<details><summary>Show Terraform output</summary>',
              '',
              '```hcl',
              raw,
              '```',
              '',
              '</details>',
              footer,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${body}\n`);
            }

      - name: Check Terraform exit code
        env:
          INIT_RC: ${{ steps.init.outputs.rc }}
          PLAN_RC: ${{ steps.plan.outputs.rc }}
        run: |
          if [ "$INIT_RC" != "0" ]; then
            exit "$INIT_RC"
          fi
          if [ "$PLAN_RC" != "0" ] && [ "$PLAN_RC" != "2" ]; then
            exit "$PLAN_RC"
          fi

  apply:
    name: Apply
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: terraform-apply
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Verify PR is still open at reviewed commit
        id: verify
        uses: actions/github-script@v9
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number,
            });

            if (pr.state !== 'open') {
              core.setFailed(`PR #${pull_number} is ${pr.state}; refusing to apply.`);
              return;
            }
            if (!pr.head.repo || pr.head.repo.full_name !== `${owner}/${repo}`) {
              core.setFailed('Refusing to apply a PR from a fork.');
              return;
            }
            if (pr.head.sha !== process.env.EXPECTED_SHA) {
              core.setFailed(
                `PR head moved from ${process.env.EXPECTED_SHA.slice(0, 7)} to ${pr.head.sha.slice(0, 7)}. Approve the latest workflow run or comment /tf apply instead.`,
              );
              return;
            }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: gh-tf-apply-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '<2.0.0'
          terraform_wrapper: false

      - name: Terraform Init
        id: init
        run: |
          set +e
          terraform init -no-color -input=false 2>&1 | tee "$RUNNER_TEMP/tf-output.txt"
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Terraform Apply
        id: apply
        if: steps.init.outputs.rc == '0'
        run: |
          set +e
          terraform apply -auto-approve -no-color -input=false -lock-timeout=5m 2>&1 | tee "$RUNNER_TEMP/tf-output.txt"
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Comment apply result on PR
        if: always() && steps.init.outcome != 'skipped'
        uses: actions/github-script@v9
        env:
          INIT_RC: ${{ steps.init.outputs.rc }}
          APPLY_RC: ${{ steps.apply.outputs.rc }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const outPath = path.join(process.env.RUNNER_TEMP, 'tf-output.txt');
            let raw = fs.existsSync(outPath)
              ? fs.readFileSync(outPath, 'utf8').trim()
              : '(no Terraform output captured)';

            const maxLen = 55000;
            if (raw.length > maxLen) {
              raw = `${raw.slice(0, maxLen)}\n\n... (output truncated; see full workflow logs)`;
            }

            const ok = process.env.INIT_RC === '0' && process.env.APPLY_RC === '0';
            const shortSha = (process.env.HEAD_SHA || '').slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const heading = ok
              ? '🚀 Terraform Apply Succeeded'
              : '❌ Terraform Apply Failed';

            const body = [
              `### ${heading}`,
              `Commit \`${shortSha}\` · Triggered via Environment approval · [Workflow logs](${runUrl})`,
              '',
              '<details><summary>Show Terraform output</summary>',
              '',
              '```hcl',
              raw,
              '```',
              '',
              '</details>',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${body}\n`);
            }

      - name: Check Terraform exit code
        env:
          INIT_RC: ${{ steps.init.outputs.rc }}
          APPLY_RC: ${{ steps.apply.outputs.rc }}
        run: |
          if [ "$INIT_RC" != "0" ]; then
            exit "$INIT_RC"
          fi
          if [ "$APPLY_RC" != "0" ]; then
            exit "$APPLY_RC"
          fi

  manual:
    name: Manual
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-manual
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Verify OIDC role variable is configured
        env:
          ROLE_ARN: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Repository variable AWS_TERRAFORM_ROLE_ARN is not set. See terraform/README.md for OIDC bootstrap steps."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: gh-tf-manual-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '<2.0.0'
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -no-color -input=false

      - name: Terraform ${{ inputs.action }}
        id: tf
        env:
          TF_ACTION: ${{ inputs.action }}
        run: |
          set +e
          if [ "$TF_ACTION" = "apply" ]; then
            terraform apply -auto-approve -no-color -input=false -lock-timeout=5m 2>&1 | tee "$RUNNER_TEMP/tf-output.txt"
          else
            terraform plan -no-color -input=false -lock-timeout=5m 2>&1 | tee "$RUNNER_TEMP/tf-output.txt"
          fi
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        if: always() && steps.tf.outcome != 'skipped'
        env:
          TF_ACTION: ${{ inputs.action }}
          TF_RC: ${{ steps.tf.outputs.rc }}
        run: |
          {
            echo "### Terraform ${TF_ACTION} (${GITHUB_REF_NAME})"
            echo ""
            echo '```hcl'
            if [ -f "$RUNNER_TEMP/tf-output.txt" ]; then
              head -c 55000 "$RUNNER_TEMP/tf-output.txt"
            else
              echo "(no Terraform output captured)"
            fi
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check Terraform exit code
        env:
          TF_RC: ${{ steps.tf.outputs.rc }}
        run: |
          if [ "$TF_RC" != "0" ]; then
            exit "$TF_RC"
          fi
