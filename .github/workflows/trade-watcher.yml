name: Trade watcher

on:
  schedule:
    # Every 10 minutes, year-round. Free on public repos.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Watch trades
        env:
          LEAGUE_ID: '794521'
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_TRADES }}
          POSTED_TRADES_FILE: ${{ runner.temp }}/posted-trades.json
        run: |
          # Season year: Aug-Dec maps to current calendar year, Jan-Jul to prior.
          MONTH=$(date +%-m)
          YEAR=$(date +%-Y)
          export LEAGUE_YEAR=$(( MONTH >= 8 ? YEAR : YEAR - 1 ))
          echo "Watching league 794521 season ${LEAGUE_YEAR}"
          node scripts/watch-trades.mjs

      # Second Discord message: research the trade, roast the losing owner.
      # Never blocks ledger commit or publishing when the LLM misbehaves.
      - name: Roast the losing owner
        continue-on-error: true
        env:
          LEAGUE_ID: '794521'
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_TRADES }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          POSTED_TRADES_FILE: ${{ runner.temp }}/posted-trades.json
        run: |
          if [[ ! -f "$POSTED_TRADES_FILE" ]]; then
            echo "No accepted trades posted; skipping roast."
            exit 0
          fi
          MONTH=$(date +%-m)
          YEAR=$(date +%-Y)
          export LEAGUE_YEAR=$(( MONTH >= 8 ? YEAR : YEAR - 1 ))
          node scripts/roast-trade.mjs "$POSTED_TRADES_FILE"

      - name: Commit ledger updates
        id: commit
        run: |
          if [[ -n "$(git status --porcelain static/data)" ]]; then
            git config user.name "trade-watcher"
            git config user.email "actions@users.noreply.github.com"
            git add static/data
            git commit -m "chore: Update trade ledger"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No ledger changes"
          fi

      - name: Publish ledger to site
        if: steps.commit.outputs.changed == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        run: |
          aws s3 cp static/data/trades.json s3://derbruden.com/static/data/trades.json --cache-control "public, max-age=0, must-revalidate"
          aws cloudfront create-invalidation --distribution-id E3CDWEEK40CKI2 --paths "/static/data/trades.json"
