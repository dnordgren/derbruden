name: Weekly Publish

on:
  schedule:
    # Tuesdays 14:00 UTC (~10am ET) during regular season months.
    - cron: '0 14 * 1,9-12 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm install --prefix scripts

      - name: Configure league auth
        run: |
          {
            echo "ESPN_S2=${{ secrets.ESPN_S2 }}"
            echo "SWID=${{ secrets.SWID }}"
          } > scripts/.env

      - name: Generate power rankings
        run: node scripts/generate-power-rankings.js

      - name: Generate sit-start efficiency and Manager Wins Added
        run: make sitstart

      # First-party roster record for trade reconstruction: ESPN ages
      # transaction terms out, but weekly roster snapshots let us diff
      # team->player maps and recover who went where. Tuesdays 14:00 UTC
      # means the prior scoring period is final before this runs.
      - name: Capture roster snapshots
        env:
          LEAGUE_ID: '794521'
        run: |
          MONTH=$(date +%-m)
          YEAR=$(date +%-Y)
          export LEAGUE_YEAR=$(( MONTH >= 8 ? YEAR : YEAR - 1 ))
          node scripts/capture-rosters.mjs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy
        run: make deploy

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_POWERRANKINGS }}
        run: node scripts/post-discord.js

      - name: Commit updated pages and data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/power-rankings.html scripts/power-rankings-state.json src/sit-start.html static/data/sit-start.json static/data/roster-snapshots.json src/an.html src/ar.html src/cr.html src/dm.html src/dn.html src/gm.html src/ik.html src/jh.html src/jo.html src/zs.html
          if git diff --cached --quiet; then
            echo "No changes since last publish."
          else
            git commit -m "chore: Weekly power rankings and sit-start update"
            git push
          fi
