<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DerBruden.com | Trades</title>

    <link rel="icon" href="../static/ico/header-icon-32.png" type="image/x-icon" />
    <link rel="shortcut icon" href="../static/ico/header-icon-32.png" type="image/x-icon" />

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f5f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131512" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="../static/css/site.css" />
    <link rel="preload" href="../static/fonts/archivo-latin-var.woff2" as="font" type="font/woff2" crossorigin />

    <style>
      h2 {
        margin-bottom: 5px;
      }

      .updated {
        color: var(--muted);
        font-size: 0.9em;
        margin-top: 0;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }

      th,
      td {
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }

      th {
        border-bottom: 2px solid var(--ink);
        font-size: 0.72rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--muted);
      }

      .event-badge {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 10px;
        font-size: 0.8em;
        font-weight: 600;
        color: var(--paper);
        background: var(--muted);
      }

      .event-badge.accepted {
        background: var(--accent);
      }

      .event-badge.declined,
      .event-badge.vetoed {
        background: var(--down);
      }

      .side {
        white-space: nowrap;
        font-weight: 600;
      }

      @media (max-width: 768px) {
        table,
        thead,
        tbody,
        tr {
          display: block;
        }

        thead {
          display: none;
        }

        tbody tr {
          margin-bottom: 16px;
          border-bottom: 1px solid var(--line);
          padding-bottom: 12px;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <div class="header-container">
        <div class="header">
          <a href="./index.html">
            <img src="../static/img/header-logo.webp" alt="DerBruden.com" class="logo" width="200" height="153" />
          </a>
          <div>
            <h1 class="site-title">DerBruden.com</h1>
            <p class="tagline">Strange dreams lately?</p>
          </div>
        </div>
      </div>
    </header>

    <nav aria-label="Main">
      <ul>
        <li><a href="./about.html">About</a></li>
        <li><a href="./owners.html">League Owners</a></li>
        <li><a href="./power-rankings.html">Power Rankings</a></li>
        <li><a href="./trades.html" aria-current="page">Trades</a></li>
        <li><a href="./drafts.html">Drafts</a></li>
      </ul>
    </nav>

    <main>
      <h2>Trade Log</h2>
      <p class="updated">Season <span id="season">2026</span><span id="updated-at"></span></p>
      <table>
        <thead>
          <tr>
            <th scope="col">Date</th>
            <th scope="col">Status</th>
            <th scope="col">Details</th>
          </tr>
        </thead>
        <tbody id="trade-rows">
          <tr>
            <td colspan="3">Loading...</td>
          </tr>
        </tbody>
      </table>
    </main>

    <footer>
      <p>
        <a href="https://fantasy.espn.com/football/league?leagueId=794521" target="_blank">ESPN</a> /
        <a href="https://discord.com/channels/870404843582406696/870404844681322549" target="_blank">Discord</a>
      </p>
    </footer>

    <script>
      const escapeHtml = value =>
        String(value).replace(
          /[&<>"']/g,
          c =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;',
            })[c]
        )

      const formatDate = iso => {
        if (!iso) return ''
        const d = new Date(iso)
        return (
          d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
          ', ' +
          d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })
        )
      }

      const render = data => {
        if (data.season) document.getElementById('season').textContent = data.season
        if (data.updated) document.getElementById('updated-at').textContent = ' - updated ' + formatDate(data.updated)

        const rows = document.getElementById('trade-rows')
        if (!data.trades || data.trades.length === 0) {
          rows.innerHTML = '<tr><td colspan="3">No trades yet this season.</td></tr>'
          return
        }

        rows.innerHTML = data.trades
          .map(t => {
            const badgeClass = String(t.event || '')
              .toLowerCase()
              .replace('trade_', '')
            const details = (t.teams || [])
              .map(
                team =>
                  '<span class="side">' +
                  escapeHtml(team.name) +
                  '</span> sends ' +
                  escapeHtml((team.gives || []).join(', '))
              )
              .join('<br>')
            return (
              '<tr>' +
              '<td>' +
              escapeHtml(formatDate(t.date)) +
              '</td>' +
              '<td><span class="event-badge ' +
              badgeClass +
              '">' +
              escapeHtml(String(t.event || '').replace('TRADE_', '')) +
              '</span></td>' +
              '<td>' +
              details +
              '</td>' +
              '</tr>'
            )
          })
          .join('')
      }

      fetch('../static/data/trades.json')
        .then(res => res.json())
        .then(render)
        .catch(() => {
          document.getElementById('trade-rows').innerHTML = '<tr><td colspan="3">Could not load trade data.</td></tr>'
        })
    </script>
  </body>
</html>
