<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DerBruden.com | Trades</title>

  <link rel="icon" href="../static/ico/header-icon-32.png" type="image/x-icon">
  <link rel="shortcut icon" href="../static/ico/header-icon-32.png" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: "Archivo", sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
    }

    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0px;
    }

    .logo {
      width: 100px;
      height: 75px;
    }

    .site-title {
      margin: 0;
      font-size: 24px;
    }

    .tagline {
      margin: 0;
      color: #666;
    }

    nav {
      margin-bottom: 30px;
    }

    h2 {
      margin-bottom: 5px;
    }

    .updated {
      color: #666;
      font-size: 0.9em;
      margin-top: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th,
    td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid #eee;
      vertical-align: top;
    }

    th {
      border-bottom: 2px solid #eee;
      font-size: 0.85em;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #666;
    }

    .event-badge {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 10px;
      font-size: 0.8em;
      font-weight: 600;
      color: #fff;
      background: #95a5a6;
    }

    .event-badge.accepted {
      background: #27ae60;
    }

    .event-badge.declined,
    .event-badge.vetoed {
      background: #c0392b;
    }

    .side {
      white-space: nowrap;
      font-weight: 600;
    }

    footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }

    a {
      color: #000;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .header-container {
        flex-direction: column;
        text-align: center;
      }

      table,
      thead,
      tbody,
      tr {
        display: block;
      }

      thead {
        display: none;
      }

      tbody tr {
        margin-bottom: 16px;
        border-bottom: 1px solid #eee;
        padding-bottom: 12px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-container">
      <div class="header">
        <a href="./index.html">
          <img src="../static/img/header-logo.webp" alt="DerBruden.com" class="logo">
        </a>
        <div>
          <h1 class="site-title">DerBruden.com</h1>
          <p class="tagline">Strange dreams lately?</p>
        </div>
      </div>
    </div>
  </header>

  <nav>
    <p><a href="./about.html">About</a> || <a href="./owners.html">League Owners</a></p>
  </nav>

  <main>
    <h2>Trade Log</h2>
    <p class="updated">Season <span id="season">2026</span><span id="updated-at"></span></p>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Status</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody id="trade-rows">
        <tr>
          <td colspan="3">Loading...</td>
        </tr>
      </tbody>
    </table>
  </main>

  <footer>
    <p>
      <a href="https://fantasy.espn.com/football/league?leagueId=794521" target="_blank">ESPN</a> /
      <a href="https://discord.com/channels/870404843582406696/870404844681322549" target="_blank">Discord</a>
    </p>
  </footer>

  <script>
    const escapeHtml = (value) =>
      String(value).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c]));

    const formatDate = (iso) => {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
        ', ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    };

    const render = (data) => {
      if (data.season) document.getElementById('season').textContent = data.season;
      if (data.updated)
        document.getElementById('updated-at').textContent =
          ' - updated ' + formatDate(data.updated);

      const rows = document.getElementById('trade-rows');
      if (!data.trades || data.trades.length === 0) {
        rows.innerHTML = '<tr><td colspan="3">No trades yet this season.</td></tr>';
        return;
      }

      rows.innerHTML = data.trades.map((t) => {
        const badgeClass = String(t.event || '').toLowerCase().replace('trade_', '');
        const details = (t.teams || [])
          .map((team) =>
            '<span class="side">' + escapeHtml(team.name) + '</span> sends ' +
            escapeHtml((team.gives || []).join(', ')))
          .join('<br>');
        return (
          '<tr>' +
          '<td>' + escapeHtml(formatDate(t.date)) + '</td>' +
          '<td><span class="event-badge ' + badgeClass + '">' +
          escapeHtml(String(t.event || '').replace('TRADE_', '')) + '</span></td>' +
          '<td>' + details + '</td>' +
          '</tr>'
        );
      }).join('');
    };

    fetch('../static/data/trades.json')
      .then((res) => res.json())
      .then(render)
      .catch(() => {
        document.getElementById('trade-rows').innerHTML =
          '<tr><td colspan="3">Could not load trade data.</td></tr>';
      });
  </script>
</body>

</html>
