<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DerBruden.com | Trades</title>
  <meta property="og:title" content="DerBruden.com | Trades">
  <meta property="og:description" content="Every trade in Der Bruden fantasy football history: who won, who lost, and the deals that swung championships.">
  <meta property="og:url" content="https://derbruden.com/trades.html">
  <meta property="og:image" content="https://derbruden.com/static/img/league-logo.webp">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="DerBruden.com | Trades">
  <meta name="twitter:description" content="Every trade in Der Bruden fantasy football history: who won, who lost, and the deals that swung championships.">
  <meta name="twitter:image" content="https://derbruden.com/static/img/league-logo.webp">

    <!--#include file="partials/head-common.html" -->
  <style>
    h1 {
      margin-bottom: 5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th,
    td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    th {
      border-bottom: 2px solid var(--line);
      font-size: 0.85em;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    .event-badge {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 10px;
      font-size: 0.8em;
      font-weight: 600;
      color: #fff;
      background: #5d6d7e;
    }

    .event-badge.accepted {
      background: #1e7d43;
    }

    .event-badge.declined,
    .event-badge.vetoed {
      background: #c0392b;
    }

    .side {
      white-space: nowrap;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      table,
      thead,
      tbody,
      tr,
      td {
        display: block;
      }

      thead {
        display: none;
      }

      tbody tr {
        margin-bottom: 16px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 12px;
      }

      td[colspan]::before {
        content: none;
      }

      td::before {
        display: block;
        font-size: 0.75em;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin-bottom: 2px;
      }

      td:nth-child(1)::before {
        content: 'Date';
      }

      td:nth-child(2)::before {
        content: 'Status';
      }

      td:nth-child(3)::before {
        content: 'Details';
      }
    }
  </style>
</head>

  <body>
  <!--#include file="partials/site-header.html" -->

  <!--#include file="partials/nav.html" -->

    <main id="main">
      <h1>Trade Log</h1>
      <p class="updated">Season <span id="season">2026</span><span id="updated-at"></span></p>
      <table>
        <caption class="visually-hidden">Trade log</caption>
        <thead>
          <tr>
            <th scope="col">Date</th>
            <th scope="col">Status</th>
            <th scope="col">Details</th>
          </tr>
        </thead>
        <tbody id="trade-rows">
          <tr>
            <td colspan="3">Loading...</td>
          </tr>
        </tbody>
      </table>
    </main>

  <!--#include file="partials/footer.html" -->

    <script src="../static/js/site-utils.js?v=1"></script>
    <script>
      const render = data => {
        if (data.season) document.getElementById('season').textContent = data.season
        if (data.updated) document.getElementById('updated-at').textContent = ' - updated ' + formatDate(data.updated)

        const rows = document.getElementById('trade-rows')
        if (!data.trades || data.trades.length === 0) {
          rows.innerHTML = '<tr><td colspan="3">No trades yet this season.</td></tr>'
          return
        }

        rows.innerHTML = data.trades
          .map(t => {
            const badgeClass = String(t.event || '')
              .toLowerCase()
              .replace('trade_', '')
            const details = (t.teams || [])
              .map(
                team =>
                  '<span class="side">' +
                  escapeHtml(team.name) +
                  '</span> sends ' +
                  escapeHtml((team.gives || []).join(', '))
              )
              .join('<br>')
            return (
              '<tr>' +
              '<td>' +
              escapeHtml(formatDate(t.date)) +
              '</td>' +
              '<td><span class="event-badge ' +
              badgeClass +
              '">' +
              escapeHtml(String(t.event || '').replace('TRADE_', '')) +
              '</span></td>' +
              '<td>' +
              details +
              '</td>' +
              '</tr>'
            )
          })
          .join('')
      }

      fetch('../static/data/trades.json')
        .then(res => res.json())
        .then(render)
        .catch(() => {
          document.getElementById('trade-rows').innerHTML = '<tr><td colspan="3">Could not load trade data.</td></tr>'
        })
    </script>
  </body>
</html>
