<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DerBruden.com | Trades</title>

    <!--#include file="partials/head-common.html" -->
</head>

  <body>
  <!--#include file="partials/site-header.html" -->

  <!--#include file="partials/nav.html" -->

    <main>
      <h2>Trade Log</h2>
      <p class="updated">Season <span id="season">2026</span><span id="updated-at"></span></p>
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Status</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody id="trade-rows">
          <tr>
            <td colspan="3">Loading...</td>
          </tr>
        </tbody>
      </table>
    </main>

  <!--#include file="partials/footer.html" -->

    <script>
      const escapeHtml = value =>
        String(value).replace(
          /[&<>"']/g,
          c =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;',
            })[c]
        )

      const formatDate = iso => {
        if (!iso) return ''
        const d = new Date(iso)
        return (
          d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
          ', ' +
          d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })
        )
      }

      const render = data => {
        if (data.season) document.getElementById('season').textContent = data.season
        if (data.updated) document.getElementById('updated-at').textContent = ' - updated ' + formatDate(data.updated)

        const rows = document.getElementById('trade-rows')
        if (!data.trades || data.trades.length === 0) {
          rows.innerHTML = '<tr><td colspan="3">No trades yet this season.</td></tr>'
          return
        }

        rows.innerHTML = data.trades
          .map(t => {
            const badgeClass = String(t.event || '')
              .toLowerCase()
              .replace('trade_', '')
            const details = (t.teams || [])
              .map(
                team =>
                  '<span class="side">' +
                  escapeHtml(team.name) +
                  '</span> sends ' +
                  escapeHtml((team.gives || []).join(', '))
              )
              .join('<br>')
            return (
              '<tr>' +
              '<td>' +
              escapeHtml(formatDate(t.date)) +
              '</td>' +
              '<td><span class="event-badge ' +
              badgeClass +
              '">' +
              escapeHtml(String(t.event || '').replace('TRADE_', '')) +
              '</span></td>' +
              '<td>' +
              details +
              '</td>' +
              '</tr>'
            )
          })
          .join('')
      }

      fetch('../static/data/trades.json')
        .then(res => res.json())
        .then(render)
        .catch(() => {
          document.getElementById('trade-rows').innerHTML = '<tr><td colspan="3">Could not load trade data.</td></tr>'
        })
    </script>
  </body>
</html>
