<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DerBruden.com | Transactions</title>
  <meta property="og:title" content="DerBruden.com | Transactions">
  <meta property="og:description" content="Every move in Der Bruden fantasy football history: trades, waiver claims, and bids — who won, who lost, and the deals that swung championships.">
  <meta property="og:url" content="https://derbruden.com/transactions.html">
  <meta property="og:image" content="https://derbruden.com/static/img/league-logo.webp?v=1">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="DerBruden.com | Transactions">
  <meta name="twitter:description" content="Der Bruden trades, waiver claims, and bids: every move in league history.">
  <meta name="twitter:image" content="https://derbruden.com/static/img/league-logo.webp?v=1">

    <!--#include file="partials/head-common.html" -->
  <style>
    h1 {
      margin-bottom: 5px;
    }

    main h2 {
      margin-top: 40px;
      margin-bottom: 0;
    }

    .event-badge {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 10px;
      font-size: 0.8em;
      font-weight: 600;
      color: #fff;
      background: #5d6d7e;
    }

    .event-badge.accepted {
      background: #1e7d43;
    }

    .event-badge.declined,
    .event-badge.vetoed {
      background: #c0392b;
    }

    .event-badge.waiver {
      background: #8e44ad;
    }

    .event-badge.pending {
      background: #b45309;
    }

    .side {
      white-space: nowrap;
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    table.order {
      max-width: 640px;
    }

    th,
    td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    th {
      border-bottom: 2px solid var(--line);
      font-size: 0.85em;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    td.num,
    th.num {
      text-align: right;
      white-space: nowrap;
    }

    @media (max-width: 768px) {
      table.moves {
        min-width: 0;
      }

      table.moves,
      table.moves thead,
      table.moves tbody,
      table.moves tr,
      table.moves td {
        display: block;
      }

      table.moves thead {
        display: none;
      }

      table.moves tbody tr {
        margin-bottom: 16px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 12px;
      }

      table.moves td {
        border-bottom: none;
        padding: 4px 12px;
      }

      table.moves td[colspan]::before {
        content: none;
      }

      table.moves td::before {
        display: block;
        font-size: 0.75em;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin-bottom: 2px;
      }

      #trade-rows td:nth-child(1)::before {
        content: 'Date';
      }

      #trade-rows td:nth-child(2)::before {
        content: 'Status';
      }

      #trade-rows td:nth-child(3)::before {
        content: 'Details';
      }

      #move-rows td:nth-child(1)::before {
        content: 'Date';
      }

      #move-rows td:nth-child(2)::before {
        content: 'Type';
      }

      #move-rows td:nth-child(3)::before {
        content: 'Owner';
      }

      #move-rows td:nth-child(4)::before {
        content: 'Details';
      }

      table.moves .side {
        white-space: normal;
      }
    }
  </style>
</head>

  <body>
  <!--#include file="partials/site-header.html" -->

  <!--#include file="partials/nav.html" -->

    <main id="main">
      <h1>Transactions</h1>

      <h2>Trade Log</h2>
      <p class="updated" aria-live="polite">Season <span id="trade-season">2026</span><span id="trade-updated-at"></span></p>
      <div class="table-container" tabindex="0" role="region" aria-label="Trade log table, scroll horizontally to see all columns">
      <table class="stats-table moves">
        <caption class="visually-hidden">Trade log</caption>
        <thead>
          <tr>
            <th scope="col">Date</th>
            <th scope="col">Status</th>
            <th scope="col">Details</th>
          </tr>
        </thead>
        <tbody id="trade-rows">
          <tr>
            <td colspan="3">Loading...</td>
          </tr>
        </tbody>
      </table>
      </div>

      <h2>Waiver Order</h2>
      <p class="updated" aria-live="polite">Season <span id="waiver-season">2026</span><span id="waiver-updated-at"></span>. Order refreshes daily.</p>
      <table class="order">
        <caption class="visually-hidden">Waiver order</caption>
        <thead>
          <tr>
            <th scope="col" class="num">#</th>
            <th scope="col">Owner</th>
            <th scope="col" class="num">Record</th>
            <th scope="col" class="num">Moves</th>
          </tr>
        </thead>
        <tbody id="order-rows">
          <tr>
            <td colspan="4">Loading...</td>
          </tr>
        </tbody>
      </table>

      <h2>Recent Moves</h2>
      <table class="moves">
        <caption class="visually-hidden">Recent waiver moves</caption>
        <thead>
          <tr>
            <th scope="col">Date</th>
            <th scope="col">Type</th>
            <th scope="col">Owner</th>
            <th scope="col">Details</th>
          </tr>
        </thead>
        <tbody id="move-rows">
          <tr>
            <td colspan="4">Loading...</td>
          </tr>
        </tbody>
      </table>
    </main>

  <!--#include file="partials/footer.html" -->

    <script src="../static/js/site-utils.js?v=1"></script>
    <script>
      const renderTrades = data => {
        if (data.season) document.getElementById('trade-season').textContent = data.season
        if (data.updated) document.getElementById('trade-updated-at').textContent = ' - updated ' + formatDate(data.updated)

        const rows = document.getElementById('trade-rows')
        if (!data.trades || data.trades.length === 0) {
          rows.innerHTML = '<tr><td colspan="3">No trades yet this season.</td></tr>'
          return
        }

        rows.innerHTML = data.trades
          .map(t => {
            const badgeClass = String(t.event || '')
              .toLowerCase()
              .replace('trade_', '')
            const details = (t.teams || [])
              .map(
                team =>
                  '<span class="side">' +
                  escapeHtml(team.name) +
                  '</span> sends ' +
                  escapeHtml((team.gives || []).join(', '))
              )
              .join('<br>')
            return (
              '<tr>' +
              '<td>' +
              escapeHtml(formatDate(t.date)) +
              '</td>' +
              '<td><span class="event-badge ' +
              badgeClass +
              '">' +
              escapeHtml(String(t.event || '').replace('TRADE_', '')) +
              '</span></td>' +
              '<td>' +
              details +
              '</td>' +
              '</tr>'
            )
          })
          .join('')
      }

      const waiverRecord = row => (row.wins == null ? '' : `${row.wins}-${row.losses}${row.ties ? '-' + row.ties : ''}`)

      const ownerLink = row => {
        const label = escapeHtml(row.owner || 'Team ' + row.teamId)
        return row.owner ? '<a href="./' + row.owner.toLowerCase() + '.html">' + label + '</a>' : label
      }

      const moveDetails = move => {
        const parts = []
        if (move.adds.length) parts.push('added ' + move.adds.map(escapeHtml).join(', '))
        if (move.drops.length) parts.push('dropped ' + move.drops.map(escapeHtml).join(', '))
        if (move.bid) parts.push(`<span class="muted">$${move.bid} bid</span>`)
        return parts.join('; ') || '&mdash;'
      }

      const renderWaivers = data => {
        if (data.season) document.getElementById('waiver-season').textContent = data.season
        if (data.updated) document.getElementById('waiver-updated-at').textContent = ' - updated ' + formatDate(data.updated)

        document.getElementById('order-rows').innerHTML =
          data.order && data.order.length
            ? data.order
                .map(
                  r =>
                    '<tr>' +
                    '<td class="num">' +
                    r.rank +
                    '</td>' +
                    '<td>' +
                    ownerLink(r) +
                    '</td>' +
                    '<td class="num">' +
                    waiverRecord(r) +
                    '</td>' +
                    '<td class="num">' +
                    r.moves +
                    '</td>' +
                    '</tr>'
                )
                .join('')
            : '<tr><td colspan="4">No waiver order available.</td></tr>'

        document.getElementById('move-rows').innerHTML =
          data.moves && data.moves.length
            ? data.moves
                .map(m => {
                  const badge =
                    '<span class="event-badge ' +
                    (m.event === 'WAIVER' ? 'waiver' : '') +
                    '">' +
                    escapeHtml(m.event === 'WAIVER' ? 'Waiver' : 'Free agent') +
                    '</span>'
                  const pending = m.status === 'PROPOSED' ? ' <span class="event-badge pending">Pending</span>' : ''
                  return (
                    '<tr>' +
                    '<td>' +
                    escapeHtml(formatDate(m.date)) +
                    '</td>' +
                    '<td>' +
                    badge +
                    pending +
                    '</td>' +
                    '<td>' +
                    ownerLink(m) +
                    '</td>' +
                    '<td>' +
                    moveDetails(m) +
                    '</td>' +
                    '</tr>'
                  )
                })
                .join('')
            : '<tr><td colspan="4">No waiver moves yet this season.</td></tr>'
      }

      fetch('../static/data/trades.json')
        .then(res => res.json())
        .then(renderTrades)
        .catch(() => {
          document.getElementById('trade-rows').innerHTML = '<tr><td colspan="3">Could not load trade data.</td></tr>'
        })

      fetch('../static/data/waivers.json')
        .then(res => res.json())
        .then(renderWaivers)
        .catch(() => {
          document.getElementById('order-rows').innerHTML = '<tr><td colspan="4">Could not load waiver data.</td></tr>'
          document.getElementById('move-rows').innerHTML = '<tr><td colspan="4">Could not load waiver data.</td></tr>'
        })
    </script>
  </body>
</html>
