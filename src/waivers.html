<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DerBruden.com | Waivers</title>

    <!--#include file="partials/head-common.html" -->
    <style>
      h1 {
        margin-bottom: 5px;
      }

      main h3 {
        margin-top: 40px;
        margin-bottom: 0;
      }

      .updated {
        color: var(--muted);
        font-size: 0.9em;
        margin-top: 0;
      }

      td.num,
      th.num {
        text-align: right;
        white-space: nowrap;
      }

      .event-badge {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 10px;
        font-size: 0.8em;
        font-weight: 600;
        color: #fff;
        background: #5d6d7e;
      }

      .event-badge.waiver {
        background: #8e44ad;
      }

      .event-badge.pending {
        background: #b45309;
      }

      .muted {
        color: var(--muted);
      }
    </style>
  </head>

  <body>
    <!--#include file="partials/site-header.html" -->

    <!--#include file="partials/nav.html" -->

    <main id="main">
      <h1>Waivers</h1>
      <p class="updated" aria-live="polite">Season <span id="season">2026</span><span id="updated-at"></span>. Order refreshes daily.</p>

      <h3>Waiver Order</h3>
      <div class="table-container" tabindex="0" role="region" aria-label="Waiver order table, scroll horizontally to see all columns">
      <table class="stats-table">
        <caption class="visually-hidden">Waiver order</caption>
        <thead>
          <tr>
            <th scope="col" class="num">#</th>
            <th scope="col">Owner</th>
            <th scope="col">Team</th>
            <th scope="col" class="num">Record</th>
            <th scope="col" class="num">Moves</th>
          </tr>
        </thead>
        <tbody id="order-rows">
          <tr>
            <td colspan="5">Loading...</td>
          </tr>
        </tbody>
      </table>
      </div>

      <h3>Recent Moves</h3>
      <div class="table-container" tabindex="0" role="region" aria-label="Recent waiver moves table, scroll horizontally to see all columns">
      <table class="stats-table">
        <caption class="visually-hidden">Recent waiver moves</caption>
        <thead>
          <tr>
            <th scope="col">Date</th>
            <th scope="col">Type</th>
            <th scope="col">Owner</th>
            <th scope="col">Details</th>
          </tr>
        </thead>
        <tbody id="move-rows">
          <tr>
            <td colspan="4">Loading...</td>
          </tr>
        </tbody>
      </table>
      </div>
    </main>

    <!--#include file="partials/footer.html" -->

    <script>
      const escapeHtml = value =>
        String(value).replace(
          /[&<>"']/g,
          c =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;',
            })[c]
        )

      const formatDate = iso => {
        if (!iso) return ''
        const d = new Date(iso)
        return (
          d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
          ', ' +
          d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })
        )
      }

      const record = row => (row.wins == null ? '' : `${row.wins}-${row.losses}${row.ties ? '-' + row.ties : ''}`)

      const ownerLink = row => {
        const label = escapeHtml(row.owner || 'Team ' + row.teamId)
        return row.owner ? '<a href="./' + row.owner.toLowerCase() + '.html">' + label + '</a>' : label
      }

      const details = move => {
        const parts = []
        if (move.adds.length) parts.push('added ' + move.adds.map(escapeHtml).join(', '))
        if (move.drops.length) parts.push('dropped ' + move.drops.map(escapeHtml).join(', '))
        if (move.bid) parts.push(`<span class="muted">$${move.bid} bid</span>`)
        return parts.join('; ') || '&mdash;'
      }

      const render = data => {
        if (data.season) document.getElementById('season').textContent = data.season
        if (data.updated) document.getElementById('updated-at').textContent = ' - updated ' + formatDate(data.updated)

        document.getElementById('order-rows').innerHTML =
          data.order && data.order.length
            ? data.order
                .map(
                  r =>
                    '<tr>' +
                    '<td class="num">' +
                    r.rank +
                    '</td>' +
                    '<td>' +
                    ownerLink(r) +
                    '</td>' +
                    '<td>' +
                    escapeHtml(r.name) +
                    '</td>' +
                    '<td class="num">' +
                    record(r) +
                    '</td>' +
                    '<td class="num">' +
                    r.moves +
                    '</td>' +
                    '</tr>'
                )
                .join('')
            : '<tr><td colspan="5">No waiver order available.</td></tr>'

        document.getElementById('move-rows').innerHTML =
          data.moves && data.moves.length
            ? data.moves
                .map(m => {
                  const badge =
                    '<span class="event-badge ' +
                    (m.event === 'WAIVER' ? 'waiver' : '') +
                    '">' +
                    escapeHtml(m.event === 'WAIVER' ? 'Waiver' : 'Free agent') +
                    '</span>'
                  const pending = m.status === 'PROPOSED' ? ' <span class="event-badge pending">Pending</span>' : ''
                  return (
                    '<tr>' +
                    '<td>' +
                    escapeHtml(formatDate(m.date)) +
                    '</td>' +
                    '<td>' +
                    badge +
                    pending +
                    '</td>' +
                    '<td>' +
                    ownerLink(m) +
                    '</td>' +
                    '<td>' +
                    details(m) +
                    '</td>' +
                    '</tr>'
                  )
                })
                .join('')
            : '<tr><td colspan="4">No waiver moves yet this season.</td></tr>'
      }

      fetch('../static/data/waivers.json')
        .then(res => res.json())
        .then(render)
        .catch(() => {
          document.getElementById('order-rows').innerHTML = '<tr><td colspan="5">Could not load waiver data.</td></tr>'
          document.getElementById('move-rows').innerHTML = '<tr><td colspan="4">Could not load waiver data.</td></tr>'
        })
    </script>
  </body>
</html>
